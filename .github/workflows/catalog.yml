name: Update plugin catalog

on:
  push:
    branches: [main]
    paths:
      - '*.cs3'
      - 'catalog-config.json'
      - 'scripts/generate_catalog.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh plugin metadata
        run: python scripts/generate_catalog.py
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- plugins.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins.json
          git commit -m 'Update CS3 plugin catalog'
          git push
